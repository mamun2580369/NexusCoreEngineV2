<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Core Engine V2</title>
	
    <!-- Telegram WebApp SDK (ক্রস বাটনে চাপ দিলে বের হওয়ার পারমিশন পপ-আপের জন্য) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
	
    <script src='//libtl.com/sdk.js' data-zone='11529721' data-sdk='show_11529721'></script>
	
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --water-color: #00d2ff;
            --water-deep: #3a7bd5;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #05070a; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; color: white; overflow: hidden;
        }

        .premium-container {
            width: 90%; max-width: 400px;
            padding: 45px 30px;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 60px;
            text-align: center;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            position: relative;
        }

        /* ক্লিন ও লাইট লিকুইড সার্কেল (ঢেউয়ের ভারী অ্যানিমেশন রিমুভড) */
        .liquid-box {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 35px;
            background: #000;
            border-radius: 50%;
            border: 8px solid #111827;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 0 30px rgba(0, 210, 255, 0.2);
            overflow: hidden;
        }

        .water {
            position: absolute;
            left: 0; bottom: 0;
            width: 100%; height: 0%; /* লজিক দিয়ে কন্ট্রোল হবে */
            background: linear-gradient(to top, var(--water-deep), var(--water-color));
            transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            box-shadow: 0 -5px 20px rgba(0, 210, 255, 0.8); /* গ্লোয়িং টপ বর্ডার */
        }

        .percent-text {
            position: absolute;
            width: 100%; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            font-size: 3.8rem; font-weight: 900;
            letter-spacing: -2px;
            color: #fff;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* লাইভ আইপি (বড় ও স্পট ভিউ) এবং লোকেশন এরিয়া */
        .dev-branding {
            margin-bottom: 30px;
            padding: 5px;
        }

        .ip-info {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.7rem; /* আইপি অনেক বড় এবং স্পষ্ট করা হয়েছে */
            font-weight: 900;
            background: linear-gradient(180deg, #FFFFFF 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            filter: drop-shadow(0 2px 12px rgba(56, 189, 248, 0.6));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
            word-break: break-all;
        }

        #user-flag {
            font-size: 1.6rem; /* ফ্ল্যাগ বড় করা হয়েছে */
        }

        .location-info {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* বিশাল সাইজের আল্ট্রা-ভিজিবল এরর পপ-আপ (Nexus Engine থেকে Button পর্যন্ত) */
        .ad-error-popup {
            position: absolute;
            top: 55px;
            bottom: 110px;
            left: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(225, 29, 72, 0.98), rgba(159, 18, 57, 0.98));
            border: 2px solid #ff4d4d;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 0 60px rgba(225, 29, 72, 0.9), inset 0 0 25px rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 99;
            pointer-events: none; /* বাটনে ক্লিকে কোনো ডিস্টার্ব করবে না */
            user-select: none; /* লেখা কপি/সিলেক্ট রোধ করবে */
            -webkit-user-select: none;
            text-align: center;
        }

        .ad-error-popup.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .popup-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            animation: pulse-icon 0.8s infinite alternate;
        }

        .popup-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 3px 10px rgba(0,0,0,0.8);
            margin-bottom: 8px;
        }

        .popup-sub {
            font-size: 0.8rem;
            font-weight: 800;
            color: #ffe4e6;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
            line-height: 1.4;
        }

        @keyframes pulse-icon {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* প্রিমিয়াম বাটন */
        .sync-btn {
            background: linear-gradient(145deg, #ffffff, #cbd5e1);
            color: #020617;
            border: none;
            width: 100%; padding: 22px;
            border-radius: 25px;
            font-size: 1.1rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 100;
        }

        .sync-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 210, 255, 0.3);
        }

        .sync-btn:disabled {
            background: #1e293b; color: #475569;
            cursor: not-allowed; box-shadow: none;
        }

        #status-info {
            margin-top: 20px; font-size: 11px;
            text-transform: uppercase; letter-spacing: 2px;
            color: #334155;
        }
    </style>
</head>
<body>

<div class="premium-container" id="main-ui">
    <div style="font-size: 9px; letter-spacing: 6px; color: #38bdf8; margin-bottom: 30px; font-weight: 900;">Nexus Core Engine V2</div>
    
    <div class="liquid-box">
        <div class="water" id="water-fill"></div>
        <div class="percent-text" id="ui-percent">0%</div>
    </div>

    <!-- বড় আকৃতির লাইভ আইপি, ফ্ল্যাগ এবং লোকেশন -->
    <div class="dev-branding">
        <div class="ip-info">
            <span id="user-flag" style="-webkit-text-fill-color: initial;">🌐</span> 
            <span id="user-ip">FETCHING...</span>
        </div>
        <div class="location-info" id="user-location">LOCATING SYSTEM...</div>
    </div>

    <!-- বিশাল নোটিফিকেশন পপ-আপ কার্ড -->
    <div id="ad-error-popup" class="ad-error-popup">
        <div class="popup-icon">⚠️</div>
        <div class="popup-title">AD LOAD FAILED</div>
        <div class="popup-sub" id="popup-sub-text">NETWORK ERROR OR AD REFUSED</div>
    </div>

    <button class="sync-btn" id="ui-btn" onclick="processStart()">Execute Sync</button>
    <div id="status-info">System Secure</div>
</div>

<script>
    // ০. টেলিগ্রাম এক্সিট কনফার্মেশন চালু করা (ক্রস বাটনে চাপ দিলে কনফার্মেশন চাইবে)
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.enableClosingConfirmation();
    }

    // ১. সিকিউরিটি (BD ব্লক) ও লাইভ IP, ফ্ল্যাগ ও লোকেশন ফেচিং
    async function checkSecurityAndIP() {
        try {
            const res = await fetch('https://ipwho.is/');
            const data = await res.json();

            if (data && data.success) {
                // BD সিকিউরিটি ব্লক
                if (data.country_code === 'BD') {
                    document.body.innerHTML = '<h1 style="color:red; font-family:Syncopate;">ACCESS DENIED</h1>';
                    return;
                }

                // ফ্ল্যাগ ও IP বসানো
                const flag = (data.flag && data.flag.emoji) ? data.flag.emoji : '🌐';
                document.getElementById('user-flag').innerText = flag;
                document.getElementById('user-ip').innerText = data.ip;

                // শহর, অঞ্চল এবং দেশের নাম যুক্ত করা
                const locParts = [data.city, data.region, data.country].filter(Boolean);
                document.getElementById('user-location').innerText = locParts.join(', ');
            } else {
                document.getElementById('user-ip').innerText = "127.0.0.1";
                document.getElementById('user-location').innerText = "UNKNOWN LOCATION";
            }
        } catch (e) {
            document.getElementById('user-ip').innerText = "SECURE NETWORK";
            document.getElementById('user-location').innerText = "ENCRYPTED LOCATION";
        }
    }
    checkSecurityAndIP();

    // ২. ওয়াটার লজিক
    let cyclePercent = parseInt(localStorage.getItem('savedPercent')) || 0;
    const waterFill = document.getElementById('water-fill');
    const percentEl = document.getElementById('ui-percent');
    const btnEl = document.getElementById('ui-btn');
    const statusEl = document.getElementById('status-info');
    const popupEl = document.getElementById('ad-error-popup');
    const popupSubText = document.getElementById('popup-sub-text');
    let popupTimer = null;

    // পপ-আপ দেখানোর ফাংশন (৫ সেকেন্ড পর অটো রিমুভ)
    function triggerAdError(msg) {
        if (msg) popupSubText.innerText = msg;
        popupEl.classList.add('show');

        clearTimeout(popupTimer);
        popupTimer = setTimeout(() => {
            popupEl.classList.remove('show');
        }, 5000);
    }

    function updateUI() {
        if (cyclePercent > 100) cyclePercent = 100;
        
        // পানি নিচ থেকে উপরে উঠবে
        waterFill.style.height = cyclePercent + "%";
        percentEl.innerText = cyclePercent + "%";
        localStorage.setItem('savedPercent', cyclePercent);

        // ১০০% হলে বাটন স্থায়ী লক
        if (cyclePercent >= 100) {
            btnEl.disabled = true;
            btnEl.innerText = "System Finalized";
            statusEl.innerText = "Maximum Capacity Reached";
            statusEl.style.color = "#38bdf8";
        }
    }

    function processStart() {
        if (cyclePercent >= 100) return;
        
        btnEl.disabled = true;
        statusEl.innerText = "Syncing with Core...";

        setTimeout(() => {
            if (cyclePercent < 100) {
                btnEl.disabled = false;
                statusEl.innerText = "System Secure";
            }
        }, 10000);

        if (typeof show_11529721 === 'function') {
            show_11529721().then(() => {
                cyclePercent++;
                updateUI();
            }).catch(() => {
                statusEl.innerText = "Connection Refused.";
                triggerAdError("CONNECTION REFUSED OR AD BLOCKED");
            });
        } else {
            statusEl.innerText = "Connection Refused.";
            triggerAdError("AD SDK NOT LOADED PROPERLY");
        }
    }

    // প্রাথমিক লোড
    updateUI();
</script>
</body>
</html>
